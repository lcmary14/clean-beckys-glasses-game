<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30秒極速擦眼鏡挑戰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-container {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      color: #555;
      margin-bottom: 15px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 400px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .controls {
      margin-top: 15px;
    }
    button {
      background: #ff6b81;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #ff4757;
    }
    /* 底部聲明樣式 */
    .disclaimer-footer {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #777;
      line-height: 1.6;
      text-align: center;
    }
    .disclaimer-footer p {
      margin-bottom: 6px;
    }
    .disclaimer-footer strong {
      color: #555;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>👓 30秒極速擦眼鏡挑戰</h1>
    
    <div class="hud">
      <div>時間: <span id="timer">30</span>s</div>
      <div>得分: <span id="score">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <!-- 底層清晰照片 -->
      <canvas id="bgCanvas" width="400" height="400"></canvas>
      <!-- 上層霧化/髒汙層 -->
      <canvas id="fogCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 頁尾出處與免責聲明 -->
    <footer class="disclaimer-footer">
      <p><strong>圖片出處：</strong>IDOLFACTORY / CRANIUM</p>
      <p><strong>聲明：</strong>本遊戲內容/影片僅供粉絲娛樂互動使用，無任何商業營利行為。畫面著作權歸原製作公司 IDOL FACTORY 所有。</p>
      <hr style="border: none; border-top: 1px dashed #ddd; margin: 8px 0;">
      <p><strong>Credit:</strong> IDOLFACTORY / CRANIUM</p>
      <p><strong>Disclaimer:</strong> Non-commercial fan-made content. All video materials and copyrights belong to IDOLFACTORY.</p>
    </footer>
  </div>

  <script>
    const fogCanvas = document.getElementById('fogCanvas');
    const fogCtx = fogCanvas.getContext('2d');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    
    let isDrawing = false;
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let isPlaying = false;

    // 請替換為您自己的照片網址
    const imgUrl = 'https://picsum.photos/400/400'; 
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.src = imgUrl;

    img.onload = () => {
      resetGame();
    };

    function resetGame() {
      // 繪製底層清晰圖
      bgCtx.drawImage(img, 0, 0, 400, 400);

      // 繪製上層霧化/髒汙層
      fogCtx.fillStyle = 'rgba(200, 200, 200, 0.85)';
      fogCtx.fillRect(0, 0, 400, 400);
      fogCtx.fillStyle = '#666';
      fogCtx.font = '20px Arial';
      fogCtx.textAlign = 'center';
      fogCtx.fillText('按下「開始遊戲」塗擦眼鏡！', 200, 200);
    }

    function initFogLayer() {
      fogCtx.globalCompositeOperation = 'source-over';
      fogCtx.fillStyle = 'rgba(220, 220, 220, 0.95)';
      fogCtx.fillRect(0, 0, 400, 400);
    }

    function startGame() {
      if (isPlaying) return;
      isPlaying = true;
      score = 0;
      timeLeft = 30;
      document.getElementById('score').innerText = score;
      document.getElementById('timer').innerText = timeLeft;
      document.getElementById('startBtn').innerText = '遊戲進行中...';

      initFogLayer();

      // 啟動倒數計時
      gameInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(gameInterval);
      isPlaying = false;
      document.getElementById('startBtn').innerText = '再試一次';
      alert(`時間到！你的最終得分為：${score} 分！`);
    }

    // 擦拭邏輯 (橡皮擦效果)
    function clearFog(x, y) {
      if (!isPlaying) return;

      fogCtx.globalCompositeOperation = 'destination-out';
      fogCtx.beginPath();
      fogCtx.arc(x, y, 25, 0, Math.PI * 2, false);
      fogCtx.fill();

      // 每次擦拭加分
      score += 10;
      document.getElementById('score').innerText = score;
    }

    // 滑鼠與觸控事件監聽
    function getPos(e) {
      const rect = fogCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    fogCanvas.addEventListener('mousedown', (e) => { isDrawing = true; const pos = getPos(e); clearFog(pos.x, pos.y); });
    fogCanvas.addEventListener('mousemove', (e) => { if (isDrawing) { const pos = getPos(e); clearFog(pos.x, pos.y); } });
    fogCanvas.addEventListener('mouseup', () => isDrawing = false);
    fogCanvas.addEventListener('mouseleave', () => isDrawing = false);

    fogCanvas.addEventListener('touchstart', (e) => { isDrawing = true; const pos = getPos(e); clearFog(pos.x, pos.y); });
    fogCanvas.addEventListener('touchmove', (e) => { if (isDrawing) { const pos = getPos(e); clearFog(pos.x, pos.y); } });
    fogCanvas.addEventListener('touchend', () => isDrawing = false);
  </script>
</body>
</html>
